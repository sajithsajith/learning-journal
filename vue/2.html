<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vue Quick Play</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      button { margin-top: 8px; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Hello, {{ name }} 👋</h1>
      <p>Count: {{ count }}</p>
      <button @click="increment">Click +1</button>
      <button @click="decrease">Click -1</button>
      <button @click="reset">Reset</button>
    </div>

    <script>
      const app = Vue.createApp({
        data() {
          return { name: "Sajith", count: 0 }
        },
        methods: {
          increment() { this.count += 1 },
          decrease() { this.count -= 1 },
          reset() { this.count = 0 }
        }
      })
      app.mount("#app")
    </script>
  </body>
</html>
