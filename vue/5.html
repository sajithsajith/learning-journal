<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vue Quick Play</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      button {
        margin-top: 8px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <greeting :who="who" @greet="onGreet"></greeting>
    </div>

    <script>
      const Greeting = {
        props: ["who"],
        template: `
    <div>
      <p>Hello, {{ who }}!</p>
      <button @click="$emit('greet', 'Hi from child')">Greet</button>
    </div>
  `,
      };

      const app = Vue.createApp({
        data() {
          return { who: "Sajith" };
        },
        methods: {
          onGreet(msg) {
            alert(msg);
          },
        },
      });
      app.component("greeting", Greeting);
      app.mount("#app");
    </script>
  </body>
</html>
