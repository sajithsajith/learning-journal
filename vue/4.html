<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vue Quick Play</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      button {
        margin-top: 8px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p>Count: {{ count }}</p>
      <p>Double: {{ double }}</p>
      <button @click="increment()">+1</button>
    </div>

    <script>
      const app = Vue.createApp({
        setup() {
          const count = Vue.ref(0);
          const increment = () => {
            count.value++;
          };
          const double = Vue.computed(() => count.value * 2);
          return { count, increment, double };
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
